<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daemon VRM Avatar</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #d7dde5; font-family: system-ui, sans-serif; }
      #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: center; }
      #hud > div { background: rgba(20, 26, 34, 0.85); border: 1px solid rgba(255,255,255,0.08); padding: 10px 12px; border-radius: 10px; }
      #canvas { width: 100%; height: 100%; display: block; }
      input, button { background: #121a24; color: #d7dde5; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 10px; }
      button { cursor: pointer; }
      .small { opacity: 0.8; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>
        <div><strong>VRM Avatar Viewer</strong></div>
        <div class="small">Connects to daemon WS and plays procedural animations.</div>
      </div>
      <div>
        <label>WS URL: <input id="wsUrl" size="32" value="ws://localhost:8766" /></label>
        <button id="connectBtn">Connect</button>
        <span id="status" class="small">disconnected</span>
      </div>
      <div>
        <label>VRM URL: <input id="vrmUrl" size="36" placeholder="file URL or https://..." /></label>
        <button id="loadBtn">Load</button>
        <span class="small">Tip: host a `.vrm` and paste URL.</span>
      </div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- CDN imports (no build step). -->
    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
      import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
      import { VRM, VRMLoaderPlugin, VRMUtils } from "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js";

      const canvas = document.getElementById("canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0f14);
      const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.4, 2.4);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.25, 0);
      controls.update();

      const hemi = new THREE.HemisphereLight(0xffffff, 0x223344, 1.0);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(2, 3, 2);
      scene.add(dir);

      let vrm = null;
      let ws = null;
      let state = "idle";
      let expression = { name: "neutral", intensity: 0.0 };
      let gestureQueue = [];
      let speakText = null;

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);

      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      async function loadVRM(url) {
        const gltf = await loader.loadAsync(url);
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);
        const v = await VRM.from(gltf);
        if (vrm) {
          scene.remove(vrm.scene);
          vrm.dispose();
        }
        vrm = v;
        scene.add(vrm.scene);
      }

      function setStatus(text) {
        document.getElementById("status").textContent = text;
      }

      function connectWS(url) {
        if (ws) ws.close();
        ws = new WebSocket(url);
        setStatus("connecting…");
        ws.onopen = () => setStatus("connected");
        ws.onclose = () => setStatus("disconnected");
        ws.onerror = () => setStatus("error");
        ws.onmessage = (msg) => {
          try {
            const ev = JSON.parse(msg.data);
            handleEvent(ev);
          } catch {}
        };
      }

      function handleEvent(ev) {
        if (!ev || !ev.type) return;
        if (ev.type === "state") state = ev.payload?.name || state;
        if (ev.type === "expression") {
          expression = { name: ev.payload?.name || "neutral", intensity: Number(ev.payload?.intensity ?? 0) };
        }
        if (ev.type === "gesture") gestureQueue.push(ev.payload || {});
        if (ev.type === "speak") speakText = ev.payload?.text || null;
      }

      function applyExpression() {
        if (!vrm?.expressionManager) return;
        // Map names to VRM presets (best-effort)
        const name = expression.name || "neutral";
        const i = Math.max(0, Math.min(1, expression.intensity || 0));
        // reset common
        for (const preset of ["happy","angry","sad","relaxed","surprised","neutral"]) {
          try { vrm.expressionManager.setValue(preset, 0); } catch {}
        }
        try { vrm.expressionManager.setValue(name, i); } catch {}
        // subtle mouth movement when speaking (simple, no visemes yet)
        const speaking = state === "speaking" && speakText;
        if (speaking) {
          const t = performance.now() / 1000;
          const a = 0.15 + 0.10 * Math.sin(t * 12.0);
          try { vrm.expressionManager.setValue("aa", a); } catch {}
        } else {
          try { vrm.expressionManager.setValue("aa", 0); } catch {}
        }
      }

      // Very simple procedural bone animation (no external clips required)
      function applyProcedural(dt) {
        if (!vrm?.humanoid) return;
        const t = performance.now() / 1000;
        const hips = vrm.humanoid.getBoneNode("hips");
        const head = vrm.humanoid.getBoneNode("head");
        const spine = vrm.humanoid.getBoneNode("spine");
        const lUpperArm = vrm.humanoid.getBoneNode("leftUpperArm");
        const rUpperArm = vrm.humanoid.getBoneNode("rightUpperArm");

        // Base idle sway
        if (hips) hips.position.y = 0 + 0.01 * Math.sin(t * 1.5);
        if (spine) spine.rotation.y = 0.05 * Math.sin(t * 0.6);
        if (head) head.rotation.y = 0.10 * Math.sin(t * 0.5);

        // State overlays
        if (state === "thinking") {
          if (head) head.rotation.x = -0.05 + 0.03 * Math.sin(t * 1.8);
          if (spine) spine.rotation.x = -0.02;
        } else if (state === "executing") {
          if (spine) spine.rotation.x = 0.02;
        } else if (state === "listening") {
          if (head) head.rotation.x = 0.03;
        }

        // Gestures (consume queue)
        const g = gestureQueue.shift();
        if (g && head) {
          const name = g.name || "";
          const intensity = Math.max(0, Math.min(1, Number(g.intensity ?? 0.4)));
          if (name === "nod") {
            head.rotation.x += 0.25 * intensity;
          } else if (name === "shake") {
            head.rotation.y += 0.35 * intensity;
          } else if (name === "wave") {
            if (rUpperArm) rUpperArm.rotation.z -= 1.0 * intensity;
            if (lUpperArm) lUpperArm.rotation.z += 0.2 * intensity;
          }
        }
      }

      let last = performance.now();
      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const dt = (now - last) / 1000;
        last = now;
        if (vrm) {
          applyExpression();
          applyProcedural(dt);
          vrm.update(dt);
        }
        renderer.render(scene, camera);
      }
      animate();

      document.getElementById("connectBtn").onclick = () => {
        const url = document.getElementById("wsUrl").value.trim();
        if (url) connectWS(url);
      };

      document.getElementById("loadBtn").onclick = async () => {
        const url = document.getElementById("vrmUrl").value.trim();
        if (!url) return;
        try {
          await loadVRM(url);
        } catch (e) {
          console.error(e);
          alert("Failed to load VRM. Check URL/CORS.");
        }
      };
    </script>
  </body>
</html>
